<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farspeak — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:#0a0a0b;
    display:flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono",monospace;
  }
  .term{font-size:84px;font-weight:500;letter-spacing:-.02em;color:#f4f4f5;line-height:1}
  .prompt{color:#4cc2ff;margin-right:14px}
  .cursor{display:inline-block;width:38px;height:80px;background:#4cc2ff;margin-left:12px;vertical-align:-10px}
  .labs{font-size:42px;color:#5c5c64;letter-spacing:.1em;margin-top:6px}
</style>
</head>
<body>
  <div>
    <div class="term"><span class="prompt">&gt;</span>farspeak<span class="cursor"></span></div>
    <div class="labs">// labs</div>
  </div>
</body>
</html>
