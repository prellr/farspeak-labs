<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farspeak — Transmission variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#f4f4f5;--near:#f4f4f5;--labs:#8a8a93;--bg:#0a0a0b}
  body.light{--ink:#0a0a0b;--near:#0a0a0b;--labs:#5c5c64;--bg:#f4f4f5}
  /* full: fixed share canvas */
  html.full,body.full{width:1200px;height:630px}
  body.full{display:flex;align-items:center;justify-content:center}
  /* crop: shrink to content */
  body.crop{width:max-content;height:max-content;padding:0}
  body{background:var(--bg);font-family:"Space Grotesk",sans-serif}

  .lockup{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .wm{letter-spacing:.04em;font-size:88px;font-weight:500;line-height:1;text-transform:uppercase;color:var(--ink)}
  .wm .speak{font-weight:600}
  .row{align-self:stretch;display:flex;align-items:center;gap:24px;margin-top:-4px}
  .near{width:30px;height:30px;border-radius:50%;background:var(--near);flex:none}
  .line{flex:1;border-top:5px dashed #4cc2ff;height:0}
  .far{width:18px;height:18px;border-radius:50%;background:#4cc2ff;flex:none}
  .labs{font-family:"JetBrains Mono",monospace;font-size:34px;letter-spacing:.28em;text-transform:uppercase;color:var(--labs);flex:none}
</style>
</head>
<body>
  <div class="lockup">
    <div class="wm"><span>FAR</span><span class="speak">SPEAK</span></div>
    <div class="row">
      <span class="near"></span><span class="line"></span><span class="far"></span><span class="labs">Labs</span>
    </div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const theme = p.get('theme')||'dark';
  const fit = p.get('fit')||'full';
  document.body.classList.add(theme, fit);
  document.documentElement.classList.add(fit);
</script>
</body>
</html>
