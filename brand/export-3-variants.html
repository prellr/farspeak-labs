<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farspeak — Terminal variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#f4f4f5;--labs:#5c5c64;--bg:#0a0a0b}
  body.light{--ink:#0a0a0b;--labs:#6b6b73;--bg:#f4f4f5}
  html.full,body.full{width:1200px;height:630px}
  body.full{display:flex;align-items:center;justify-content:center}
  body.crop{width:max-content;height:max-content;padding:0}
  body{background:var(--bg);font-family:"JetBrains Mono",monospace}

  .term{font-size:84px;font-weight:500;letter-spacing:-.02em;color:var(--ink);line-height:1;white-space:nowrap}
  .prompt{color:#4cc2ff;margin-right:14px}
  .cursor{display:inline-block;width:38px;height:80px;background:#4cc2ff;margin-left:12px;vertical-align:-10px}
  .labs{font-size:42px;color:var(--labs);letter-spacing:.1em;margin-top:6px}
</style>
</head>
<body>
  <div>
    <div class="term"><span class="prompt">&gt;</span>farspeak<span class="cursor"></span></div>
    <div class="labs">// labs</div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const theme = p.get('theme')||'dark';
  const fit = p.get('fit')||'full';
  document.body.classList.add(theme, fit);
  document.documentElement.classList.add(fit);
</script>
</body>
</html>
